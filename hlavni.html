  <body class="obrazovka podsebou">
    <div class="sedsiseda min p1">
      <div class="Limelight">Vařme se strejdou Polchvarnou</div>
    </div>




    <div class="vedlesebe max">
      <div class="grayblue sidebar">
        <div style="text-align: center; width: 100%; padding-top: 30px;" class="titanic">LORE</div>
      </div>

      <div class="podsebou max">
        <div class="babyblue max hlavni">
          

          <div class="buttons-wrapper center">
            <a href="vyvoj.html">
              <button class="tlacitko1 kachna"> Plán vývoje </button>
            </a>

            <a href="infohra.html">
              <button class="tlacitko1 kachna"> Info o hře </button>
            </a>
            <a href="infopolchvarna.html">
              <button class="tlacitko1 kachna"> Info o Polchvarně </button>
            </a>

          <p id="expand-text"></p>
        </div>
      </div>
    </div>


    
    <script>
      const texts = {
        "plan vyvoje": "jak tu udleat tlacko?",
        "info o hře": "2d vařící simulátor, kdy vy, jako hlavní postava, vaříte v kuchyni s panem Polreichem. Hra obsahuje postupné vylepšení vaší kuchyně, jako je lepší sporák, výpomocní brigádníci nebo třeba i pneumatiky",
        "info o Polchvarně": "Pan Polchvarna vám chce pomoct udělat nejlepší kuchyn na světě, chce aby jste docílil svému snu být tím nejlepším kuchařem a mít tu nejlepší kuchyn. Někdy panovi Polchvarnovi chytne na nervy, ale je to naprosto normalní, jako příklady tohoto jevu jsou: Házení jídel do rybníků, zničení kuchynských nástroju a vyhození lehce přeudělaného jídla."
      };

      let active = null;

      function expand(btn) {
        const allBtns = document.querySelectorAll('.tlacitko1');
        const textEl = document.getElementById('expand-text');

        if (active === btn) {
          // close it
          allBtns.forEach(b => b.style.display = 'block');
          btn.classList.remove('expanded');
          textEl.style.display = 'none';
          active = null;
          return;
        }

        allBtns.forEach(b => {
          b.style.display = 'none';
          b.classList.remove('expanded');
        });

        btn.style.display = 'block';
        btn.classList.add('expanded');
        textEl.textContent = texts[btn.textContent.trim()];
        textEl.style.display = 'block';
        active = btn;
      }
    </script>
  </body>
